# .github/workflows/packages.yml
# ──────────────────────────────────────────────────────────────────────────────
# Do the package manifests still resolve on kali-rolling?
#
# bootstrap.sh's apt_install degrades gracefully on a bad name — bulk install fails,
# it retries per-package, and prints "skipped (unavailable on this box?)". Right
# behaviour on a live box, but it means a rename or a drop never fails anything: the
# run is green and the tool is simply missing. install/offensive-packages.txt's own
# comments record freerdp2-x11 → freerdp3-x11 → freerdp-x11 across three years, so
# this is the normal case, not an edge case.
#
# The check must run where the answer is TRUE — a maintainer's box may track
# kali-last-snapshot, which legitimately disagrees with rolling. So it runs in the
# same kalilinux/kali-rolling container bootstrap.yml tests against.
#
# ADVISORY, NOT BLOCKING. Kali is a rolling distro: a package can vanish for a few
# days mid-migration through no fault of this repo, and a hard failure would then
# red every unrelated PR. The job always succeeds and writes its findings to the job
# summary; treat a non-empty list as a to-do, not a broken build. (If you later want
# it blocking, drop the `exit 0` at the end of the resolve step — nothing else needs
# to change. There is no `|| true` anywhere in this file; an older version of this
# note said there was.)
#
# ⚠ SUMMARY-ONLY WAS NOT ENOUGH, so the step ALSO emits ::warning:: annotations. A job
# summary is a page you have to go looking for, and nobody did: `bbot` sat in the
# manifest as an apt name that resolves in NO Kali component, and `rustscan` and
# `snmp-check` sat beside it, while this job dutifully reported all three into a
# summary and exited 0 every week (dotgibson/dotfiles-Offense#260). Annotations surface
# on the PR's Checks and Files tabs without making the job blocking, which keeps the
# rolling-distro argument above intact.
#
# The logic lives in test/check-packages.sh so it is runnable by hand too:
#   make packages-check
# ──────────────────────────────────────────────────────────────────────────────
name: packages

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Wednesdays 07:00 UTC — mid-week, away from the Monday freshness watchers, so a
    # rename that lands upstream between PRs still surfaces within a week.
    - cron: "0 7 * * 3"
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: package names resolve (kali-rolling)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scheduled runs fire on every fork with Actions enabled; gate the cron on the
    # owner so a fork's clock doesn't burn minutes. PRs and dispatch still run.
    if: github.event_name != 'schedule' || github.repository_owner == 'dotgibson'
    container:
      image: kalilinux/kali-rolling@sha256:c6d78f57ebfdd9fec428a8b04f74876e66fddd08dfd328c076224a552e7332a3
    steps:
      - name: Install the checkout + check deps
        run: |
          set -euo pipefail
          apt-get update -qq
          # git for actions/checkout, bash for the script, ca-certificates for TLS.
          apt-get install -y -qq --no-install-recommends git bash ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve every manifest name against kali-rolling
        run: |
          set -uo pipefail
          rc=0
          out="$(./test/check-packages.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          {
            if [ "$rc" -eq 0 ]; then
              echo "### ✅ every package name resolves on kali-rolling"
            else
              echo "### ⚠️ some package names do not resolve on kali-rolling"
            fi
            echo ""
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # ALSO annotate, so drift is visible on the Checks/Files tabs instead of only in
          # a summary page nobody opens — see the header note. check-packages.sh prints each
          # miss as `    <name>    (<manifest>)`; pull the name back out and annotate the
          # manifest line it sits on. Still advisory: no exit code changes.
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | sed -nE 's/^[[:space:]]+([^[:space:]]+)[[:space:]]+\((.+)\)$/\1 \2/p' |
              while read -r name manifest; do
                [ -n "$name" ] && [ -f "$manifest" ] || continue
                line="$(grep -nE "^[[:space:]]*${name}([[:space:]]|$)" "$manifest" | head -1 | cut -d: -f1)"
                echo "::warning file=${manifest}${line:+,line=${line}}::${name} does not resolve on kali-rolling — a rename, a drop, a typo, or suite drift. Fix the name, or move it to an UPSTREAM comment with install notes."
              done
          fi
          # Advisory: see the header. Findings land in the summary and in annotations,
          # never in a red X.
          exit 0

      # The required corpus-commands gate reads install/impacket-binaries.lst, a CHECKED-IN
      # roster, because it must stay offline. This is the other half of that bargain: the
      # advisory job that already has a kali-rolling container keeps the roster honest.
      # Two packages, not one — impacket-scripts ships 57 wrappers and python3-impacket
      # (which it Depends on) ships the rest, including impacket-secretsdump.
      - name: Refresh the impacket roster and diff it (advisory)
        run: |
          set -uo pipefail
          cd "$(mktemp -d)" || exit 0
          for p in impacket-scripts python3-impacket; do
            apt-get download "$p" >/dev/null 2>&1 || continue
          done
          for f in ./*.deb; do
            [ -e "$f" ] || continue
            dpkg -c "$f" | grep '/usr/bin/' | sed 's|.*/usr/bin/||; s| ->.*||'
          done | grep . | sort -u >/tmp/roster.new
          cd "$GITHUB_WORKSPACE" || exit 0
          if [ ! -s /tmp/roster.new ]; then
            echo "### ⚠️ impacket roster: could not download the packages, skipped" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          grep -vE '^\s*(#|$)' install/impacket-binaries.lst | sort -u >/tmp/roster.old
          if diff -u /tmp/roster.old /tmp/roster.new >/tmp/roster.diff; then
            echo "### ✅ install/impacket-binaries.lst matches kali-rolling" >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ install/impacket-binaries.lst drifted from kali-rolling"
              echo ""
              echo "A new script means the corpus may now name something the gate would reject;"
              echo "a removed one means the gate may still be blessing a command that is gone."
              echo ""
              echo '```diff'
              cat /tmp/roster.diff
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          exit 0
