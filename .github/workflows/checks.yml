# .github/workflows/checks.yml
# ──────────────────────────────────────────────────────────────────────────────
# The repo-owned gates that dotfiles-core's reusable lint-call.yml does NOT cover:
#
#   secrets   — gitleaks over the working tree AND the full history.
#   markdown  — markdownlint against the root .markdownlint.jsonc, which existed in
#               this repo with NOTHING running it.
#   companion — tamper check on the SECOND vendored subtree. core-integrity.yml
#               guards core/; offensive/companion/ had freshness and view-drift but
#               nothing asserting the vendored tree still matches companion.lock.
#   views     — the corpus counts quoted in hacktheplanet, PURPLE-TEAM.md and
#               OFFENSIVE-METHODOLOGY.md are hand-typed prose about a VENDORED subtree,
#               and two of those files carry their own caveat that the numbers go stale
#               on every companion-sync. They did, twice (#261, #262 — and CHANGELOG
#               records the same fix once already, for the v2.10.0 sync). No existing
#               gate can see it: gen-views.sh --check byte-compares block CONTENT and
#               has no opinion on how many blocks exist, and markdownlint cannot tell
#               101 from 102. This job is that caveat, executed.
#   traps     — refuses a bash RETURN trap that does not disarm itself (issue #198).
#               A RETURN trap is a GLOBAL slot: armed in a function it survives into the
#               caller's frame and fires again on ITS return, aborting the script under
#               `set -u`. The broken form is VALID BASH, so lint-call.yml's shellcheck
#               and `bash -n` both pass it, and bootstrap.yml only ever runs
#               --links-only — so no other gate anywhere observes it.
#
# WHY SECRET SCANNING MATTERS HERE MORE THAN ANYWHERE ELSE IN THE FLEET: this is a
# public repo whose own .gitignore header says "engagement data must NEVER land
# here". Core gates that with a gitleaks pre-commit hook; this repo had no
# equivalent at any layer. GitHub's push protection (repo settings) is the other
# half — it stops a credential at push time; this stops one that is already in a
# commit, and scans history so an old one can't hide.
#
# NO TRIGGER-LEVEL PATH FILTER, deliberately. A workflow skipped by `paths:` never
# produces a check run, so a required status check on it leaves every non-matching
# PR stuck on "Expected — waiting for status". These jobs are cheap and always run,
# which is what makes them safe to mark required. (The same reasoning is why the
# thin callers lost their filters — see lint.yml / bootstrap.yml.)
#
# Tool versions + SHA-256s come from core/scripts/tool-versions.env via the vendored
# composite action, so the gate toolchain here is the same verified one Core uses.
# ──────────────────────────────────────────────────────────────────────────────
name: checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the working-tree scan below catches what is staged now, the
          # `git log` scan catches what was committed and later deleted. A shallow
          # clone would silently make the second scan a no-op.
          fetch-depth: 0

      - name: Load Core's pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' core/scripts/tool-versions.env >>"$GITHUB_ENV"

      # setup-core-tools installs into `bindir` but deliberately does NOT touch PATH
      # — its own comment says "the caller prepends bindir to PATH", which is what
      # lets the verified binary win over any preinstalled system copy. Do that here,
      # before the action runs, exactly as dotfiles-core's ci.yml does.
      - name: Put the verified tool bindir on PATH
        run: |
          mkdir -p "$HOME/.local/core-tools/bin"
          echo "$HOME/.local/core-tools/bin" >>"$GITHUB_PATH"

      - name: Install pinned gitleaks
        uses: ./core/.github/actions/setup-core-tools
        with:
          gitleaks: "true"

      # -c core/gitleaks.toml — ONE POLICY FILE, Core's, which is the rule Core's own reusable
      # `lint-call.yml` secrets leg states: every repo is measured the same way and no repo
      # widens its own allowlist. Running the STOCK rule set instead is not stricter, it is
      # differently wrong: several default rules match on credential-shaped POSITION rather
      # than content — `curl-auth-user` fires on anything after `curl -u` — so a variable
      # reference, which is the SECURE shape because the value comes from the environment and
      # never enters the file, was reported as a leak.
      #
      # Concretely: the vendored `core/CHANGELOG.md` documents that very allowlist and quotes
      # the example it was written for, so the stock scan flagged Core's explanation of the
      # rule as a violation of it, and both legs went red on a Core sync that introduced no
      # credential at all.
      #
      # It does NOT blind the gate. The allowlist is scoped to the matched VALUE
      # (`regexTarget = "secret"`), not to a path, a rule or a repo. Verified both directions
      # against this tree with the pinned gitleaks 8.30.1: the variable-reference form passes,
      # and a literal `curl -sk -u admin:<value>` in the same position still fails.
      #
      # The path is the VENDORED copy, so the policy moves with Core on the next sync instead
      # of becoming a second hand-maintained rule set here.
      - name: Scan the working tree
        run: gitleaks detect --no-git -c core/gitleaks.toml --redact --verbose --exit-code 1

      # History gets the same policy for the same reason — and it matters more here, because
      # a historical finding cannot be fixed forward, only by a rewrite. A false positive
      # pinned into history would wedge this gate permanently.
      - name: Scan the full commit history
        run: gitleaks detect -c core/gitleaks.toml --redact --verbose --exit-code 1

  markdown:
    name: markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Core's pinned tool versions
        run: grep -E '^[A-Z0-9_]+=' core/scripts/tool-versions.env >>"$GITHUB_ENV"

      - name: Install markdownlint-cli2 (pinned)
        run: npm install -g "markdownlint-cli2@${MARKDOWNLINT_VERSION:?not loaded from core/scripts/tool-versions.env}"

      # Repo-owned markdown only. The two vendored subtrees are gated by their own
      # upstreams (dotfiles-core and htpx) — a finding there is fixed there, not here,
      # and linting them would just produce noise this repo cannot action.
      - name: Lint repo-owned markdown
        run: |
          set -euo pipefail
          mapfile -t docs < <(git ls-files '*.md' ':!:core/**' ':!:offensive/companion/**')
          if ((${#docs[@]} == 0)); then echo "no repo-owned markdown"; exit 0; fi
          printf '  %s\n' "${docs[@]}"
          markdownlint-cli2 "${docs[@]}"

  companion-integrity:
    name: companion integrity (vendored htpx vs companion.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # exit 2 = TAMPERED, 1 = malformed lock, 0 = pristine or a clean skip
      # (unreachable upstream is a capability gap, not a tamper signal). Branch on the
      # code so the job summary says which of the three actually happened.
      - name: Assert offensive/companion/ is pristine
        run: |
          set -uo pipefail
          rc=0
          out="$(./test/check-companion-integrity.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0) { echo "### ✅ vendored offensive/companion/ is pristine"; } >>"$GITHUB_STEP_SUMMARY" ;;
            2)
              {
                echo "### ❌ vendored offensive/companion/ was hand-edited"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
                echo ""
                echo "That tree is a git-subtree copy of dotgibson/htpx and is overwritten on the"
                echo "next \`scripts/sync-companion.sh\`. Fix it upstream in htpx, then re-sync."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              {
                echo "### ❌ companion-integrity failed (exit $rc)"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  return-traps:
    name: trap discipline (no leaked RETURN traps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain step: the guard needs git and grep, both of which the runner has.
      # It reads `git ls-files`, so the default shallow checkout is fine — it inspects
      # the tree at this commit, never history.
      - name: Assert every RETURN trap disarms itself
        run: |
          set -uo pipefail
          rc=0
          out="$(./test/check-return-traps.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "### ✅ every RETURN trap disarms itself" >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ a RETURN trap is armed without disarming itself"
              echo ""
              echo '```'
              printf '%s\n' "$out"
              echo '```'
              echo ""
              echo "A bash RETURN trap is a **global slot**, not a function-scoped one: it"
              echo "survives into the caller's frame and fires again on *its* return, where the"
              echo "local it cleans up is out of scope and \`set -u\` makes that fatal. Disarm"
              echo "first — \`trap 'trap - RETURN; rm -rf \"\$tmp\"' RETURN\`. Background: #198."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  view-counts:
    name: view counts (prose vs vendored corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain step and no fetch-depth: the gate needs git, grep and sed, all of
      # which the runner has, and it reads `git ls-files` plus three files at THIS commit
      # — never history — so the default shallow checkout is exactly right.
      #
      # exit 2 = a stale count (the signal), 1 = the gate could not run or an anchor no
      # longer matches its sentence, 0 = clean or a graceful skip. Branch on the code so
      # the summary distinguishes "your prose is stale" from "you rewrote the sentence the
      # gate measures" — telling a maintainer the wrong one is how a prose gate gets
      # deleted instead of fixed.
      - name: Assert the views still state the corpus's real counts
        run: |
          set -uo pipefail
          rc=0
          out="$(./test/check-view-counts.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0)
              echo "### ✅ the view counts match the vendored corpus" >>"$GITHUB_STEP_SUMMARY"
              ;;
            2)
              {
                echo "### ❌ a hand-typed corpus count has gone stale"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
                echo ""
                echo "The tree is right and the prose is wrong. Fix the numbers in the repo-owned"
                echo "view files — \`offensive/hacktheplanet\`, \`PURPLE-TEAM.md\`,"
                echo "\`OFFENSIVE-METHODOLOGY.md\` — and **never** in \`offensive/companion/\`,"
                echo "which is a git-subtree copy of dotgibson/htpx and is overwritten by the next"
                echo "\`scripts/sync-companion.sh\`."
                echo ""
                echo "The semantic buckets beside them (59 cloud/SaaS/CI-CD, 13 C2-egress/Impact,"
                echo "7 Linux, 71 no-event-ID, 79 blue corpus-only, 68%/75%) are **not** checked by"
                echo "this gate — nothing in the entries marks an entry \"cloud\". Re-read those by"
                echo "hand while you are in the file."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              {
                echo "### ❌ view-counts could not run (exit $rc)"
                echo ""
                echo '```'
                printf '%s\n' "$out"
                echo '```'
                echo ""
                echo "This is a **gate** failure, not a stale count: usually an anchor phrase that no"
                echo "longer matches because the sentence was rewritten. Re-anchor it in"
                echo "\`test/check-view-counts.sh\` in the same PR as the rewrite."
              } >>"$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
